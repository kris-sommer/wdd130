<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact us for White Water Rafting adventures!">
    <meta name="author" content="Kristopher Sommer">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us – White Water Rafting</title>
</head>

<body class="contact-page">
    <header>
        <img src="images/z-wwr-blue.jpg" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <!-- <h1 class="about-h1">White Water Rafting Company</h1> -->
            <h1>White Water Rafting Company</h1>
            <p>465 N University Ave, Provo, UT 84601</p>
            <p>Provo, Utah</p>
            <p>1-801-rafting</p>
            <p>rafting-adventures@gmail.com</p>
        </div>

        <div class="row-3">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3008.9469989103686!2d-111.57393434251819!3d40.35580259534824!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1759299141223!5m2!1sen!2sus"
                 allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

            <form action="#" class="contact-form">
                <!-- <fieldset> -->
                    <div class="labels">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail">
                <!-- </fieldset> -->
                    </div>

                <!-- <p>Choose your preferred contact method:</p> -->
                    
                    <div class="message-purpose">
                        <div class="message-label">
                            <p>Message Purpose</p>
                        </div>
                        <div class="message-input">
                                <div class="checkbox">
                                    <input type="radio" id="general-inquiry" name="general inquiry" value="general-inquiry">
                                    <label for="general-inquiry">General Inquiry</label>
                                </div>

                                <div class="checkbox">
                                    <input type="radio" id="res-question" name="reservation question" value="res-question">
                                    <label for="res-question">Reservation Question</label>
                                </div>

                                <div class="checkbox">
                                    <input type="radio" id="website" name="website suggestion" value="website" checked>
                                    <label for="website">Website Suggestion</label>
                                </div>
                         </div> 
                    </div>   
                    <div class="message-textarea">
                        <label for="message">Message:</label>

                        <textarea id="message">Type here</textarea>
                    </div>    
                <input type="checkbox" id="subscribe" name="subscribe">    
                <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                <button type="submit">Get in touch!</button>

            </form>
        </div>
        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/employee-1.jpg" alt="Valued Employee">
                    <figcaption>Jason Smith </figcaption>
                </figure>
                <figure>
                    <img src="images/employee-2.jpg" alt="Valued Employee">
                    <figcaption>Alex Johnson</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-3.jpg" alt="Valued Employee">    
                    <figcaption>Vanessa Lee</figcaption>
                </figure>
            </div>    
        </section>
    </main>

    <footer>
        <p>© 2025 | Whitewater Rafting | Kristopher Sommer</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-icon.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-icon.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-icon.svg" alt="Instagram Icon">
            </a>    
        </nav>
    </footer>

</body>

</html>
